<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Score & Follow-up</title><style>body{font:16px system-ui;background:#f6f8f4;color:#18322b;margin:0}.wrap{max-width:1050px;margin:auto;padding:38px 22px}h1{font-size:clamp(34px,5vw,58px);margin:8px 0}.muted{color:#5b756a}.grid{display:grid;grid-template-columns:350px 1fr;gap:20px}.card{background:white;border:1px solid #d9e4db;border-radius:18px;padding:22px}label{display:block;margin:10px 0;font-size:14px;font-weight:700}input,select{width:100%;box-sizing:border-box;margin-top:5px;padding:11px;border:1px solid #b3c8bb;border-radius:8px;font:inherit}button{background:#1f754e;color:white;border:0;border-radius:8px;padding:12px 16px;cursor:pointer;font-weight:700}.score{font-size:64px;font-weight:800;color:#176947}.draft{border-left:4px solid #74c7a0;background:#f1f7f2;padding:15px;margin:14px 0;white-space:pre-wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><div class="wrap"><small>AITACLAB / REAL ESTATE DEMO 04</small><h1>Lead scoring & follow-up</h1><p class="muted">Explainable priority score and a human review queue. This demo sends no messages.</p><div class="grid"><form class="card" id="form"><h2>Enquiry</h2><label>Name<input name="name" value="Sara"></label><label>Budget AED<input name="budget" type="number" value="2000000"></label><label>Inventory minimum<input name="min" type="number" value="1500000"></label><label>Inventory maximum<input name="max" type="number" value="3000000"></label><label>Area<input name="area" value="Dubai Marina"></label><label>Type<input name="type" value="apartment"></label><label>Timeline<select name="timeline"><option value="now">Within a month</option><option value="quarter">Within 3 months</option><option value="later">Later</option></select></label><label>Financing<select name="financing"><option value="ready">Ready</option><option value="unknown">Unknown</option></select></label><button>Score and draft</button></form><div class="card"><div id="score" class="score">—</div><h2 id="tier">Waiting</h2><p id="reasons" class="muted"></p><h3>Review queue</h3><div id="drafts"></div><button id="download" type="button">Download queue JSON</button><p class="muted">Agent approval and customer consent are required before sending.</p></div></div></div><script type="module">import{score,drafts}from'./logic.mjs';let queue=[];const form=document.querySelector('#form');form.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(form)),r=score(v);document.querySelector('#score').textContent=r.score+'/100';document.querySelector('#tier').textContent=r.tier+' priority';document.querySelector('#reasons').textContent=r.reasons.join(' · ')||'No positive criteria';const box=document.querySelector('#drafts');box.replaceChildren();queue=drafts(v);for(const d of queue){const div=document.createElement('div');div.className='draft';div.textContent=`${d.when} · ${d.channel}\n${d.text}`;box.append(div)}};document.querySelector('#download').onclick=()=>{if(!queue.length)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(queue,null,2)],{type:'application/json'}));a.download='follow-up-review-queue.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};form.requestSubmit();</script></html>
